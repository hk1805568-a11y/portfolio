
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harleen | Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 360px;
    background: #171717;
    padding: 25px;
    border-radius: 18px;
    border: 1px solid #333;
    box-shadow: 0 0 30px #a855f744;
}

h1 {
    text-align: center;
    color: #a855f7;
    margin-bottom: 20px;
}

#display {
    width: 100%;
    height: 80px;
    background: #080808;
    border: 1px solid #444;
    border-radius: 10px;
    color: white;
    font-size: 30px;
    text-align: right;
    padding: 15px;
    margin-bottom: 20px;
    outline: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 9px;
    font-size: 20px;
    background: #292929;
    color: white;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: #444;
}

button:active {
    transform: scale(.94);
}

.operator {
    background: #7134a8;
}

.operator:hover {
    background: #8b45cc;
}

.clear {
    background: #dc2626;
}

.clear:hover {
    background: #991b1b;
}

.equal {
    background: #a855f7;
}

.equal:hover {
    background: #7e22ce;
}

.zero {
    grid-column: span 2;
}

</style>
</head>

<body>

<div class="calculator">

    <h1>Calculator</h1>

    <input type="text"
           id="display"
           value="0"
           readonly
           aria-label="Calculator display">

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>

        <button class="operator" onclick="deleteLast()">DEL</button>

        <button class="operator" onclick="appendValue('%')">%</button>

        <button class="operator" onclick="appendValue('/')">÷</button>


        <button onclick="appendValue('7')">7</button>

        <button onclick="appendValue('8')">8</button>

        <button onclick="appendValue('9')">9</button>

        <button class="operator" onclick="appendValue('*')">×</button>


        <button onclick="appendValue('4')">4</button>

        <button onclick="appendValue('5')">5</button>

        <button onclick="appendValue('6')">6</button>

        <button class="operator" onclick="appendValue('-')">−</button>


        <button onclick="appendValue('1')">1</button>

        <button onclick="appendValue('2')">2</button>

        <button onclick="appendValue('3')">3</button>

        <button class="operator" onclick="appendValue('+')">+</button>


        <button class="zero" onclick="appendValue('0')">0</button>

        <button onclick="appendValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

</div>


<script>

// Get calculator display

let display = document.getElementById("display");


// Add value to display

function appendValue(value) {

    if (display.value === "Error") {

        display.value = "0";

    }

    if (display.value === "0" && /[0-9.]/.test(value)) {

        display.value = value;

    } else {

        display.value += value;

    }

}


// Clear all

function clearDisplay() {

    display.value = "0";

}


// Delete last character

function deleteLast() {

    display.value = display.value.slice(0, -1);

    if (display.value === "") {

        display.value = "0";

    }

}


// Calculate result

function calculate() {

    let expression = display.value;

    // Allow only calculator characters

    if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {

        display.value = "Error";

        return;

    }

    try {

        let result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {

            display.value = "Error";

        } else {

            display.value = String(
                Number(result.toPrecision(12))
            );

        }

    } catch(error) {

        display.value = "Error";

    }

}


// Keyboard support

document.addEventListener("keydown", function(event) {

    let key = event.key;

    if (/^[0-9.]$/.test(key)) {

        appendValue(key);

    }

    else if (["+", "-", "*", "/", "%"].includes(key)) {

        appendValue(key);

    }

    else if (key === "Enter" || key === "=") {

        event.preventDefault();

        calculate();

    }

    else if (key === "Backspace") {

        deleteLast();

    }

    else if (key === "Escape") {

        clearDisplay();

    }

});

</script>

</body>
</html>
