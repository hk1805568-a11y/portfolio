
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harleen | To-Do List</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    background: #171717;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #333;
    box-shadow: 0 0 25px #a855f733;
}

h1 {
    text-align: center;
    color: #a855f7;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

.input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    background: #252525;
    border: 1px solid #444;
    border-radius: 7px;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #a855f7;
}

.add-btn {
    background: #a855f7;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn:hover {
    background: #7e22ce;
}

.stats {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    margin: 22px 0 12px;
    font-size: 14px;
}

ul {
    list-style: none;
}

li {
    background: #252525;
    padding: 13px;
    margin: 10px 0;
    border-radius: 7px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.task-text {
    flex: 1;
    overflow-wrap: anywhere;
}

.task-text.completed {
    text-decoration: line-through;
    color: #777;
}

.check-btn {
    width: 20px;
    height: 20px;
    accent-color: #a855f7;
    cursor: pointer;
}

.delete-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #991b1b;
}

.empty {
    text-align: center;
    color: #777;
    padding: 25px 0;
}

.clear-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: transparent;
    border: 1px solid #a855f7;
    color: #a855f7;
    border-radius: 7px;
    cursor: pointer;
}

.clear-btn:hover {
    background: #a855f7;
    color: white;
}

@media(max-width: 420px) {
    .container {
        padding: 20px;
    }

    .input-area {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>
    <p class="subtitle">Organize your day, one task at a time!</p>

    <div class="input-area">

        <input type="text"
               id="taskInput"
               placeholder="Enter your task...">

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>

    </div>

    <div class="stats">
        <span id="totalTasks">Total: 0</span>
        <span id="completedTasks">Completed: 0</span>
    </div>

    <ul id="taskList"></ul>

    <button class="clear-btn" onclick="clearAllTasks()">
        Clear All Tasks
    </button>

</div>

<script>

// Get saved tasks from Local Storage

let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];


// Save tasks

function saveTasks() {

    localStorage.setItem("myTasks", JSON.stringify(tasks));

}


// Display tasks

function displayTasks() {

    let taskList = document.getElementById("taskList");

    taskList.innerHTML = "";

    if (tasks.length === 0) {

        taskList.innerHTML =
        '<p class="empty">No tasks yet. Add your first task!</p>';

    }

    tasks.forEach(function(task, index) {

        let li = document.createElement("li");

        let checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.className = "check-btn";
        checkbox.checked = task.completed;

        checkbox.addEventListener("change", function() {

            toggleTask(index);

        });

        let span = document.createElement("span");

        span.textContent = task.text;
        span.className = "task-text";

        if (task.completed) {

            span.classList.add("completed");

        }

        let deleteButton = document.createElement("button");

        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-btn";

        deleteButton.addEventListener("click", function() {

            deleteTask(index);

        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);

        taskList.appendChild(li);

    });

    updateStats();

}


// Add task

function addTask() {

    let input = document.getElementById("taskInput");

    let taskText = input.value.trim();

    if (taskText === "") {

        alert("Please enter a task!");

        return;

    }

    tasks.push({

        text: taskText,
        completed: false

    });

    input.value = "";

    saveTasks();

    displayTasks();

    input.focus();

}


// Complete task

function toggleTask(index) {

    tasks[index].completed = !tasks[index].completed;

    saveTasks();

    displayTasks();

}


// Delete task

function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    displayTasks();

}


// Clear all tasks

function clearAllTasks() {

    if (tasks.length === 0) return;

    if (confirm("Are you sure you want to delete all tasks?")) {

        tasks = [];

        saveTasks();

        displayTasks();

    }

}


// Update task counter

function updateStats() {

    let total = tasks.length;

    let completed = tasks.filter(
        task => task.completed
    ).length;

    document.getElementById("totalTasks").textContent =
    "Total: " + total;

    document.getElementById("completedTasks").textContent =
    "Completed: " + completed;

}


// Enter key support

document.getElementById("taskInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        addTask();

    }

});


// Load saved tasks

displayTasks();

</script>

</body>
</html>
